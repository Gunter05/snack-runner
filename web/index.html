<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Remplacé par la valeur de `--base-href` au build (« / » par défaut).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SnackRunner : demande une course sur le campus ou gagne un peu d'argent en livrant les autres étudiants.">
  <meta name="theme-color" content="#0E0E10">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SnackRunner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SnackRunner</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Évite le flash blanc avant le démarrage de Flutter. */
    html, body { margin: 0; height: 100%; background: #0E0E10; }
    .sr-loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #9A9A94;
      font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div class="sr-loading" aria-live="polite">Chargement de SnackRunner…</div>
  <noscript>
    <p style="color:#F2F2F0;text-align:center;font-family:sans-serif">
      SnackRunner a besoin de JavaScript pour fonctionner.
    </p>
  </noscript>
  <script src="loading.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
